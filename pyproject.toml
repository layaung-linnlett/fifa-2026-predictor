[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fifa-predictor"
version = "0.1.0"
description = "FIFA World Cup 2026 prediction engine using Elo ratings and Dixon-Coles Poisson model"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "scipy>=1.11",
    "numpy>=1.25",
    "click>=8.1",
]

[project.scripts]
fifa-predictor = "fifa_predictor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
